<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e263a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="./assets/hole-dark.png" />
    <link rel="apple-touch-icon" href="./assets/hole-dark.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>robots</title>
  </head>
  <body>
    <div id="app">
    <canvas id="canvas" width="1024" height="1024"></canvas>
    <div id="confetti" aria-hidden="true"></div>

    <div class="controls">
      <div id="rounds" aria-label="17 rounds remaining"></div>
      <div id="moves">
        <span class="moves-label">Robots moved</span>
        <strong id="move-count">0</strong>
        <span id="round-timer">Time 00:00</span>
      </div>
      <div id="message"></div>
      <label class="trail-toggle">
        <input id="show-trails" type="checkbox" />
        <span>Show robot paths</span>
      </label>
      <div class="mode-switch" aria-label="Board size">
        <button id="classic-mode" class="selected" type="button" aria-pressed="true">16x16</button>
        <button id="simple-mode" type="button" aria-pressed="false">Simple 8x8</button>
      </div>
      <button id="start" class="start-game">Start Game</button>
      <button id="undo">Undo</button>
      <button id="retry">Retry Round</button>



    </div>


    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
