<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>robots</title>
  </head>
  <body>
    <div id="app">
    <canvas id="canvas" width="1024" height="1024"></canvas>

    <div class="controls">
      <div id="rounds" aria-label="17 rounds remaining"></div>
      <div id="moves">
        <span class="moves-label">Robots moved</span>
        <strong id="move-count">0</strong>
        <span id="round-timer">Time 00:00</span>
      </div>
      <div id="message"></div>
      <label class="trail-toggle">
        <input id="show-trails" type="checkbox" />
        <span>Show robot paths</span>
      </label>
      <button id="start" class="start-game">Start Game</button>
      <button id="undo">Undo</button>
      <button id="retry">Retry Round</button>



    </div>


    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
